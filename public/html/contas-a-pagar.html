<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/projetoBasico.css">
  <title>Contas a pagar - Marau Luz e Água</title>
</head>

<body>
  <main class="container-card relatorio-container">
    <header>
      <h1>Marau <span class="cor-amarela">Luz</span> e <span class="cor-azul">Água</span></h1>
      <p class="subtitulo">Contas a pagar</p>
      <button type="button" id="btnVoltar" class="btn-sair">Voltar</button>
    </header>

    <section class="relatorio-content">
      <p id="mensagemDespesas" class="mensagem-venda" role="status"></p>

      <article class="detalhe-bloco">
        <h3>Lançar despesa</h3>
        <p class="detalhe-bloco-descricao">Cadastre os gastos (impostos, salário, luz, água ou outros) para acompanhamento e para que entrem no relatório geral.</p>
        <div class="despesa-form">
          <div>
            <label for="selectCategoriaDespesa">Categoria</label>
            <select id="selectCategoriaDespesa">
              <option value="imposto">Impostos</option>
              <option value="salario">Salário</option>
              <option value="luz">Luz</option>
              <option value="agua">Água</option>
              <option value="produto">Compra de produtos</option>
              <option value="outro">Outros gastos</option>
            </select>
          </div>
          <div>
            <label for="inputValorDespesa">Valor (R$)</label>
            <input type="number" id="inputValorDespesa" min="0.01" step="0.01" placeholder="Ex: 150,00">
          </div>
          <div>
            <label for="inputDataDespesa">Data</label>
            <input type="date" id="inputDataDespesa">
          </div>
          <div>
            <label for="inputPrazoDespesa">Prazo</label>
            <input type="date" id="inputPrazoDespesa">
          </div>
          <div class="despesa-descricao-campo">
            <label for="inputDescricaoDespesa">Descrição (opcional)</label>
            <input type="text" id="inputDescricaoDespesa" maxlength="200" placeholder="Ex: Conta de luz de agosto">
          </div>
          <button type="button" id="btnLancarDespesa" class="btn-finalizar-prazo">Lançar despesa</button>
        </div>
      </article>

      <article class="detalhe-bloco">
        <h3>Despesas do período</h3>
        <div class="relatorio-periodo-form">
          <div>
            <label for="inputPeriodoInicio">Início</label>
            <input type="date" id="inputPeriodoInicio">
          </div>
          <div>
            <label for="inputPeriodoFim">Fim</label>
            <input type="date" id="inputPeriodoFim">
          </div>
        </div>
        <div id="listaDespesas" class="lista-despesas"></div>
        <p id="despesasVazio" class="estado-vazio">Nenhuma despesa lançada neste período.</p>
        <p id="totalDespesasPeriodo" class="total-despesas-periodo"></p>
      </article>
    </section>
  </main>
  <script src="../js/session-guard.js"></script>
  <script src="../js/contas-a-pagar.js"></script>
</body>

</html>
